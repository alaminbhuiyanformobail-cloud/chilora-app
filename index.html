<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087849"><link rel="manifest" href="manifest.json"><title>চিলোড়া শানে রিসালাত সংগঠন</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf5f0;color:#173a2c;font-family:system-ui,"Noto Sans Bengali",sans-serif}.top{background:linear-gradient(135deg,#075b3c,#119568);color:white;padding:24px 16px;text-align:center;border-radius:0 0 25px 25px}.top img{height:92px;width:92px;object-fit:contain;border-radius:50%;background:white;padding:5px}.top h1{font-size:22px;margin:9px 0}.top small{opacity:.9}.wrap{max-width:650px;margin:auto;padding:14px 14px 90px}.card{background:white;border-radius:17px;padding:17px;margin:12px 0;box-shadow:0 3px 12px #0c53321a}h2{font-size:18px;margin:0 0 12px;color:#075b3c}input,textarea,select{width:100%;border:1px solid #c9dcd0;border-radius:10px;padding:12px;font:inherit;margin:6px 0 10px;background:white}button{background:#087849;color:white;border:0;border-radius:10px;padding:11px 15px;font:inherit;cursor:pointer;margin:3px}button.alt{background:#e4f2e9;color:#075b3c}.nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;box-shadow:0 -2px 15px #0001;padding:7px 2px}.nav button{background:transparent;color:#075b3c;font-size:12px;padding:8px 4px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.tile{background:#e8f5ed;border-radius:12px;padding:18px 8px;text-align:center;cursor:pointer;font-weight:650}.muted{color:#668174;font-size:13px}.item{border-bottom:1px solid #e7eee9;padding:10px 0;white-space:pre-wrap}.item:last-child{border:0}.hidden{display:none}.tag{display:inline-block;background:#e4f2e9;border-radius:12px;padding:4px 9px;font-size:12px} .danger{background:#a53030}a{color:#087849}</style></head><body>
<header class="top"><img src="logo.png" alt="সংগঠনের লোগো"><h1>চিলোড়া শানে রিসালাত সংগঠন</h1><small>অরাজনৈতিক • সেবামূলক • দ্বীনি</small></header><main class="wrap" id="main"></main><nav class="nav"><button onclick="go('home')">⌂<br>হোম</button><button onclick="go('prayer')">☪<br>নামাজ</button><button onclick="go('notices')">▤<br>নোটিশ</button><button onclick="go('accounts')">৳<br>হিসাব</button><button onclick="go('profile')">♙<br>প্রোফাইল</button></nav>
<script>
const KEY='chilora_demo_v3';let data=JSON.parse(localStorage.getItem(KEY)||'null')||{members:[],notices:[{title:'স্বাগতম',body:'চিলোড়া শানে রিসালাত সংগঠনের অ্যাপে আপনাকে স্বাগতম।',date:new Date().toLocaleDateString('bn-BD')}],accounts:[],events:[],prayers:[['ফজর',''],['যোহর',''],['আসর',''],['মাগরিব',''],['এশা','']],gallery:[],donations:[],resources:[],ramadan:[],features:{prayer:true,notices:true,accounts:true,events:true,gallery:true,about:true,members:true,donations:true,resources:true,ramadan:true,idcard:true}};data.features ||= {prayer:true,notices:true,accounts:true,events:true,gallery:true,about:true,members:true,donations:true,resources:true,ramadan:true,idcard:true};data.donations ||= [];data.resources ||= [];data.ramadan ||= [];let user=JSON.parse(sessionStorage.getItem('chilora_user')||'null');const save=()=>localStorage.setItem(KEY,JSON.stringify(data));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const admin=()=>user?.role==='admin';const main=document.getElementById('main');function go(page){if(data.features[page]===false&&!admin()){main.innerHTML='<section class="card"><h2>এই বিভাগটি বর্তমানে বন্ধ আছে</h2><button onclick="go(\'home\')">হোমে ফিরুন</button></section>';return}let html='';if(page==='home'){html='<section class="card"><h2>আসসালামু আলাইকুম</h2>সংগঠনের খবর, দ্বীনি কার্যক্রম ও সদস্যসেবা এক জায়গায়।</section><section class="card"><h2>সেবাসমূহ</h2><div class="grid">'+[['prayer','🕌 নামাজের সময়'],['notices','📢 নোটিশ'],['accounts','৳ আয়-ব্যয়'],['events','📅 অনুষ্ঠান'],['gallery','▧ গ্যালারি'],['about','ⓘ পরিচিতি'],['members','♙ সদস্য'],['idcard','🪪 পরিচয়পত্র'],['donations','🤲 অনুদান'],['resources','📖 কুরআন ও হাদিস'],['ramadan','🌙 সেহরি ও ইফতার'],['profile','⚙ আমার অ্যাকাউন্ট']].filter(([k])=>data.features[k]!==false).map(([k,v])=>'<div class="tile" onclick="go(\''+k+'\')">'+v+'</div>').join('')+'</div></section><section class="card"><h2>সর্বশেষ নোটিশ</h2>'+items(data.notices.slice(-2).reverse(),'notice')+'</section>'}
if(page==='settings'&&admin())html='<section class="card"><h2>বিভাগ চালু / বন্ধ</h2><p class="muted">পরিবর্তন এই ডেমো ব্রাউজারে সংরক্ষিত হবে।</p>'+Object.entries({prayer:'নামাজের সময়',notices:'নোটিশ',accounts:'আয়-ব্যয়',events:'অনুষ্ঠান',gallery:'গ্যালারি',about:'পরিচিতি',members:'সদস্য তালিকা',idcard:'পরিচয়পত্র',donations:'অনুদান',resources:'কুরআন ও হাদিস',ramadan:'সেহরি ও ইফতার'}).map(([k,v])=>'<div class="item"><label><input style="width:auto" type="checkbox" '+(data.features[k]!==false?'checked':'')+' onchange="toggleFeature(\''+k+'\',this.checked)"> '+v+'</label></div>').join('')+'</section>';if(page==='donations')html='<section class="card"><h2>অনুদান</h2><p>অনুদান ও সহায়তার বিষয়ে সংগঠনের সঙ্গে যোগাযোগ করুন।</p><p><a href="tel:+8801817444317">+8801817444317</a></p><p class="muted">যাচাই করা পেমেন্ট মাধ্যম যুক্ত না হওয়া পর্যন্ত অ্যাপে টাকা পাঠাবেন না।</p>'+items(data.donations,'donation')+(admin()?'<button onclick="addItem(\'donations\')">+ তথ্য যোগ করুন</button>':'')+'</section>';
if(page==='resources')html='<section class="card"><h2>কুরআন ও হাদিস</h2><p class="muted">যাচাইকৃত উৎস ও রেফারেন্স অ্যাডমিন যুক্ত করবেন।</p>'+items(data.resources,'resource')+(admin()?'<button onclick="addItem(\'resources\')">+ রেফারেন্স যোগ করুন</button>':'')+'</section>';
if(page==='ramadan')html='<section class="card"><h2>সেহরি ও ইফতারের সময়</h2><p class="muted">স্থানীয় নির্ভরযোগ্য সময়সূচি যাচাই করে যোগ করুন; স্বয়ংক্রিয় হিসাব নয়।</p>'+items(data.ramadan,'ramadan')+(admin()?'<button onclick="addItem(\'ramadan\')">+ সময় যোগ করুন</button>':'')+'</section>';
if(page==='idcard')html='<section class="card"><h2>সদস্য পরিচয়পত্র</h2>'+(user?'<div style="border:2px solid #087849;border-radius:14px;text-align:center;padding:20px"><img src="logo.png" width="70" alt="লোগো"><h2>চিলোড়া শানে রিসালাত সংগঠন</h2><h3>'+esc(user.name)+'</h3><p>সদস্য আইডি: '+esc(user.id)+'</p><span class="tag">'+(admin()?'ডেমো অ্যাডমিন':'অনুমোদিত ডেমো সদস্য')+'</span></div><p class="muted">এটি পরীক্ষামূলক পরিচয়পত্র; আনুষ্ঠানিক পরিচয়পত্র নয়।</p>':'<p>পরিচয়পত্র দেখতে সদস্য হিসেবে লগইন করুন।</p><button onclick="go(\'profile\')">লগইন</button>')+'</section>';
if(page==='about')html='<section class="card"><h2>আমাদের পরিচিতি</h2><p>চিলোড়া শানে রিসালাত সংগঠন একটি অরাজনৈতিক, সেবামূলক ও দ্বীনি সংগঠন। দ্বীনি শিক্ষা, মাহফিল, কুরআন তিলাওয়াত প্রতিযোগিতা, দাওয়াহ ও সমাজকল্যাণমূলক উদ্যোগে কাজ করে।</p><p>যোগাযোগ: <a href="tel:+8801817444317">+8801817444317</a></p><p class="muted">প্রতিষ্ঠার সাল পরে যুক্ত হবে।</p></section>';
if(page==='prayer')html='<section class="card"><h2>নামাজের সময়সূচি</h2><p class="muted">সময়গুলো অ্যাডমিন স্থানীয় মসজিদের যাচাইকৃত সূচি অনুযায়ী লিখবেন। এটি স্বয়ংক্রিয় সময় নির্ণয় বা আজান ব্যবস্থা নয়।</p>'+data.prayers.map((x,i)=>'<div class="item"><b>'+x[0]+'</b> — '+esc(x[1]||'এখনও নির্ধারিত হয়নি')+'</div>').join('')+(admin()?'<button onclick="editPrayers()">সময়সূচি সম্পাদনা</button>':'')+'</section>';
if(page==='notices')html='<section class="card"><h2>নোটিশ বোর্ড</h2>'+items([...data.notices].reverse(),'notice')+(admin()?'<button onclick="addItem(\'notices\')">+ নোটিশ যোগ করুন</button>':'')+'</section>';
if(page==='accounts'){let income=data.accounts.filter(x=>x.type==='আয়').reduce((a,x)=>a+Number(x.amount),0),expense=data.accounts.filter(x=>x.type==='ব্যয়').reduce((a,x)=>a+Number(x.amount),0);html='<section class="card"><h2>সংগঠনের হিসাব</h2><div class="grid"><div class="tile">মোট আয়<br>৳ '+income+'</div><div class="tile">মোট ব্যয়<br>৳ '+expense+'</div></div><p><b>অবশিষ্ট: ৳ '+(income-expense)+'</b></p>'+items([...data.accounts].reverse(),'account')+(admin()?'<button onclick="addItem(\'accounts\')">+ হিসাব যোগ করুন</button>':'')+'</section>'}
if(page==='events')html='<section class="card"><h2>মাহফিল ও অনুষ্ঠান</h2>'+items([...data.events].reverse(),'event')+(admin()?'<button onclick="addItem(\'events\')">+ অনুষ্ঠান যোগ করুন</button>':'')+'</section>';
if(page==='gallery')html='<section class="card"><h2>ছবি ও ভিডিও গ্যালারি</h2><p class="muted">অনুমোদিত ছবি/ভিডিওর লিংক যুক্ত করুন।</p>'+data.gallery.map(x=>'<div class="item"><a href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer">'+esc(x.title)+'</a></div>').join('')+(admin()?'<button onclick="addItem(\'gallery\')">+ লিংক যোগ করুন</button>':'')+'</section>';
if(page==='members')html='<section class="card"><h2>সদস্য তালিকা</h2>'+data.members.filter(x=>x.approved).map(x=>'<div class="item">'+esc(x.name)+' <span class="tag">'+esc(x.role)+'</span></div>').join('')+(admin()?'<h2>অনুমোদনের অপেক্ষায়</h2>'+data.members.filter(x=>!x.approved).map(x=>'<div class="item">'+esc(x.name)+' <button onclick="approve(\''+x.id+'\')">অনুমোদন</button></div>').join(''):'')+'</section>';
if(page==='profile'){html=user?'<section class="card"><h2>আমার প্রোফাইল</h2><p>'+esc(user.name)+'</p><p>'+esc(user.email)+'</p><p class="tag">'+(admin()?'অ্যাডমিন':'সদস্য')+'</p><p><button onclick="logout()">লগআউট</button></p></section>':'<section class="card"><h2>সদস্য লগইন (ডেমো)</h2><p class="muted">এটি শুধু এই ব্রাউজারে পরীক্ষার ব্যবস্থা। প্রকৃত নিরাপদ অনলাইন লগইন নয়। আসল পাসওয়ার্ড ব্যবহার করবেন না।</p><form onsubmit="login(event)"><input id="email" type="email" placeholder="ইমেইল" required><input id="pass" type="password" placeholder="ডেমো পাসওয়ার্ড" required><button>লগইন</button></form><button class="alt" onclick="register()">নতুন সদস্য নিবন্ধন</button></section>';if(admin())html+='<section class="card"><h2>অ্যাডমিন প্যানেল</h2><button onclick="go(\'settings\')">বিভাগ চালু / বন্ধ</button><button onclick="go(\'members\')">সদস্য অনুমোদন</button><button onclick="go(\'notices\')">নোটিশ</button><button onclick="go(\'accounts\')">হিসাব</button><button onclick="go(\'prayer\')">নামাজের সময়</button><button onclick="go(\'events\')">অনুষ্ঠান</button><button onclick="go(\'gallery\')">গ্যালারি</button><button onclick="go(\'donations\')">অনুদান</button><button onclick="go(\'resources\')">কুরআন ও হাদিস</button><button onclick="go(\'ramadan\')">রমজানের সময়</button></section>'}
main.innerHTML=html;window.scrollTo(0,0)}
function toggleFeature(k,v){if(!admin())return;data.features[k]=v;save();go('settings')}function items(arr,type){return arr.length?arr.map(x=>'<div class="item"><b>'+esc(x.title||x.type)+'</b> '+(x.amount?'— ৳ '+esc(x.amount):'')+'<p>'+esc(x.body||'')+'</p><small class="muted">'+esc(x.date||'')+'</small></div>').join(''):'<p class="muted">এখনো কোনো তথ্য নেই।</p>'}
function addItem(k){if(!admin())return;let title=prompt(k==='accounts'?'আয় অথবা ব্যয় লিখুন': 'শিরোনাম লিখুন');if(!title)return;let body=prompt(k==='gallery'?'https:// দিয়ে ছবি/ভিডিওর লিংক লিখুন':'বিবরণ লিখুন')||'';let x={title,body,date:new Date().toLocaleDateString('bn-BD')};if(k==='accounts'){if(!['আয়','ব্যয়'].includes(title)){alert('আয় অথবা ব্যয় লিখুন');return}x.type=title;x.amount=Number(prompt('টাকার পরিমাণ'));if(!Number.isFinite(x.amount)||x.amount<0){alert('সঠিক পরিমাণ দিন');return}}if(k==='gallery'){if(!/^https:\/\//i.test(body)){alert('নিরাপদ https লিংক দিন');return}x.url=body}data[k].push(x);save();go(k)}
function editPrayers(){if(!admin())return;data.prayers=data.prayers.map(x=>[x[0],prompt(x[0]+' সময় (যেমন ৫:১০ AM)',x[1])??x[1]]);save();go('prayer')}
function register(){let name=prompt('সদস্যের নাম');if(!name)return;let email=prompt('ডেমো ইমেইল');if(!email)return;email=email.trim().toLowerCase();if(data.members.some(x=>x.email===email)){alert('এই ইমেইল আগে ব্যবহার হয়েছে');return}let pass=prompt('শুধু পরীক্ষার জন্য নতুন ডেমো পাসওয়ার্ড (আসল পাসওয়ার্ড নয়)');if(!pass)return;data.members.push({id:String(Date.now()),name,email,pass,role:'member',approved:false});save();alert('নিবন্ধন জমা হয়েছে। অ্যাডমিন অনুমোদনের অপেক্ষা করুন।');go('profile')}
function login(e){e.preventDefault();let email=document.getElementById('email').value.trim().toLowerCase(),pass=document.getElementById('pass').value;let x=data.members.find(x=>x.email===email&&x.pass===pass);if(!x){alert('ডেমো লগইন তথ্য সঠিক নয়');return}if(!x.approved){alert('অ্যাডমিন অনুমোদন প্রয়োজন');return}user={id:x.id,name:x.name,email:x.email,role:x.role};sessionStorage.setItem('chilora_user',JSON.stringify(user));go('profile')}
function approve(id){if(!admin())return;let x=data.members.find(x=>x.id===id);if(x){x.approved=true;save();go('members')}}
function logout(){user=null;sessionStorage.removeItem('chilora_user');go('profile')}
if(!data.members.some(x=>x.role==='admin')){data.members.push({id:'demo-admin',name:'ডেমো অ্যাডমিন',email:'admin@chilora.demo',pass:'Demo1234',role:'admin',approved:true});save()}go('home');
</script><script>
